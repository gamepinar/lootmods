<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
    <defs>
        <!-- Gradients for a modern gaming/modding aesthetic -->
        <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f2fe" />
            <stop offset="100%" stop-color="#4facfe" />
        </linearGradient>
        <linearGradient id="darkBg" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0d0e12" />
            <stop offset="100%" stop-color="#181a22" />
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="url(#darkBg)" rx="20"/>

    <!-- Central Logo Mark: Hyper-minimalist Controller / Portal -->
    <g transform="translate(400, 360)" stroke="url(#neonGlow)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Main outer controller chassis outline -->
        <path d="M -140,-60 L -70,-60 L -40,-20 L 40,-20 L 70,-60 L 140,-60 C 190,-60 210,20 170,90 L 130,160 C 120,175 100,180 85,170 L 30,130 L -30,130 L -85,170 C -100,180 -120,175 -130,160 L -170,90 C -210,20 -190,-60 -140,-60 Z" />
        
        <!-- Minimalist D-Pad -->
        <path d="M -110,35 L -70,35 M -90,15 L -90,55" stroke-width="18" />
        
        <!-- Minimalist Action Buttons -->
        <circle cx="75" cy="45" r="10" fill="url(#neonGlow)" stroke="none" />
        <circle cx="105" cy="25" r="10" fill="url(#neonGlow)" stroke="none" />
    </g>

    <!-- Typography: Adjusted for "LOOTMODS" -->
    <text x="400" y="640" 
          text-anchor="middle" 
          fill="#ffffff" 
          font-family="'Segoe UI', -apple-system, Roboto, sans-serif" 
          font-weight="900" 
          font-size="72" 
          letter-spacing="14">LOOTMODS</text>
          
    <text x="400" y="700" 
          text-anchor="middle" 
          fill="#00f2fe" 
          font-family="'Segoe UI', -apple-system, Roboto, sans-serif" 
          font-weight="600" 
          font-size="20" 
          letter-spacing="28" 
          opacity="0.8">GAMING</text>
</svg>
